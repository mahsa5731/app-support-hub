name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore AppSupportHub.sln

      - name: Build solution
        run: dotnet build AppSupportHub.sln --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format AppSupportHub.sln --verify-no-changes --no-restore

      - name: Test solution
        run: dotnet test AppSupportHub.sln --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Build container image
        run: docker build --file Dockerfile --tag appsupporthub:ci .
